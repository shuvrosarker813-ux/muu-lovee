<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Love ❤️</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ff416c,#ff4b2b,#c471ed);
    color:white;
    overflow:hidden;
}

.container{
    width:90%;
    max-width:650px;
    padding:35px 20px;
    text-align:center;
    background:rgba(255,255,255,0.16);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.35);
    border-radius:30px;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
    z-index:5;
}

h1{
    font-size:40px;
    margin:0 0 25px;
    text-shadow:0 0 15px white;
}

.message{
    min-height:130px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    line-height:1.6;
}

.buttons{
    min-height:60px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin-top:15px;
}

button{
    border:0;
    padding:14px 30px;
    border-radius:30px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:transform 0.2s;
}

button:hover{
    transform:scale(1.08);
}

.yes{
    background:#ff1744;
    color:white;
    box-shadow:0 0 20px rgba(255,23,68,0.7);
}

.no{
    background:white;
    color:#ff1744;
}

.musicBox{
    margin-top:22px;
}

.musicBtn{
    background:rgba(255,255,255,0.18);
    color:white;
    border:1px solid rgba(255,255,255,0.6);
}

.musicBars{
    height:40px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:5px;
    margin-top:10px;
}

.bar{
    width:6px;
    height:15px;
    background:white;
    border-radius:10px;
    animation:music 0.8s infinite ease-in-out;
}

.bar:nth-child(2){
    animation-delay:0.1s;
}

.bar:nth-child(3){
    animation-delay:0.2s;
}

.bar:nth-child(4){
    animation-delay:0.3s;
}

.bar:nth-child(5){
    animation-delay:0.4s;
}

@keyframes music{
    50%{
        height:38px;
    }
}

/* Start Screen */

#startScreen{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff416c,#ff4b2b,#8e2de2);
    z-index:100;
}

.startBox{
    text-align:center;
    padding:30px;
}

.startBox h2{
    font-size:34px;
    margin-bottom:30px;
}

.startButton{
    background:white;
    color:#ff416c;
    font-size:20px;
}

/* Floating Hearts */

.heart{
    position:fixed;
    bottom:-40px;
    font-size:25px;
    pointer-events:none;
    z-index:1;
    animation:floatHeart 7s linear forwards;
}

@keyframes floatHeart{

    0%{
        transform:translateY(0) rotate(0);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}

/* Music Notes */

.note{
    position:fixed;
    bottom:-40px;
    font-size:25px;
    pointer-events:none;
    z-index:1;
    animation:floatNote 6s linear forwards;
}

@keyframes floatNote{

    0%{
        transform:translateY(0);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}

/* Runaway NO */

.runaway{
    position:fixed !important;
    z-index:50;
}

/* Mobile */

@media(max-width:500px){

    h1{
        font-size:30px;
    }

    .message{
        font-size:20px;
    }

    button{
        font-size:16px;
        padding:12px 22px;
    }

    .startBox h2{
        font-size:28px;
    }
}
</style>

</head>

<body>

<!-- START SCREEN -->

<div id="startScreen">

```
<div class="startBox">

    <h2>For My Special Person ❤️</h2>

    <button class="startButton" id="openButton">
        Open My Heart 💖
    </button>

</div>
```

</div>

<!-- MAIN PAGE -->

<div class="container">

```
<h1>💖 My Love 💖</h1>

<div id="message">
    Will You marry me? 💍❤️
</div>

<div class="buttons" id="buttons">

    <button class="yes" id="yesButton">
        YES ❤️
    </button>

    <button class="no" id="noButton">
        NO 😢
    </button>

</div>


<!-- MUSIC CONTROL -->

<div class="musicBox">

    <button class="musicBtn" id="musicButton">
        ▶️ Play Music
    </button>

    <div class="musicBars">

        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>

    </div>

</div>
```

</div>

<!--
    IMPORTANT:
    song.mp3 MUST BE IN THE SAME FOLDER
    AS THIS index.html FILE.
-->

<audio id="music" preload="auto">
    <source src="./song.mp3" type="audio/mpeg">
</audio>

<script>

const music = document.getElementById("music");
const musicButton = document.getElementById("musicButton");
const message = document.getElementById("message");
const buttons = document.getElementById("buttons");

let step = 1;

const START_TIME = 35;


/* =========================
   START BUTTON
========================= */

document.getElementById("openButton").addEventListener("click", function(){

    document.getElementById("startScreen").style.display = "none";

    playMusicFrom35();

});


/* =========================
   PLAY MUSIC FROM 35 SEC
========================= */

function playMusicFrom35(){

    music.load();

    music.addEventListener("loadedmetadata", function(){

        if(music.duration >= START_TIME){

            music.currentTime = START_TIME;

        }else{

            music.currentTime = 0;

        }

        music.play().then(function(){

            musicButton.innerHTML = "⏸️ Pause Music";

        }).catch(function(error){

            console.log(error);

            musicButton.innerHTML = "▶️ Play Music";

        });

    }, {once:true});

}


/* =========================
   PLAY / PAUSE BUTTON
========================= */

musicButton.addEventListener("click", function(){

    if(music.paused){

        if(music.currentTime < START_TIME && music.duration >= START_TIME){

            music.currentTime = START_TIME;

        }

        music.play().then(function(){

            musicButton.innerHTML = "⏸️ Pause Music";

        }).catch(function(){

            playMusicFrom35();

        });

    }else{

        music.pause();

        musicButton.innerHTML = "▶️ Play Music";

    }

});


/* =========================
   YES BUTTON
========================= */

document.getElementById("yesButton").addEventListener("click", function(){

    if(step === 1){

        showFinalMessage(
            "You are my Bouuu ❤️🥺💍<br><br>" +
            "Ami-o tumake bia korte chai ❤️😘<br>" +
            "Tumi amar jiboner shobcheye special manush 💖"
        );

    }

    else if(step === 2){

        showFinalMessage(
            "Amar sathe sarajibon theke jao amar Bouuu ❤️🥺💍<br><br>" +
            "Tomake chara amar jibon ami vabtei pari na ❤️"
        );

    }

    else if(step === 3){

        showFinalMessage(
            "Tumi amar shopno, amar valobasha, amar shobkichu ❤️🥺<br><br>" +
            "Sarajibon amar pashe theko amar Bouuu 💍❤️"
        );

    }

    else if(step === 4){

        showFinalMessage(
            "Amar Bouuuuu ❤️🥺💍<br><br>" +
            "Sarajibon, morer age porjonto tomar sathe thakte chai ❤️<br><br>" +
            "I Love You So Much My Love 😘❤️"
        );

    }

});


/* =========================
   NO BUTTON
========================= */

document.getElementById("noButton").addEventListener("click", function(){

    const noButton = document.getElementById("noButton");

    if(step === 1){

        message.innerHTML =
            "Na bolleo ami tomake onek valobashi 🥺💔<br>" +
            "Abar vabbe dekho na? ❤️";

        step = 2;

    }

    else if(step === 2){

        message.innerHTML =
            "Please amar mon ta venge dio na 🥺💔<br>" +
            "Ekbar YES bolo na amar Bouuu ❤️";

        step = 3;

    }

    else if(step === 3){

        message.innerHTML =
            "Ami tomake harate chai na 🥺💔<br>" +
            "Tumi amar onek aadorer Bou ❤️";

        step = 4;

    }

    else if(step === 4){

        message.innerHTML =
            "Tumi amar onek koste orjon kora adorer Bouuu 🥺❤️<br><br>" +
            "NO bolleo tomake ami eto shohoje chere dibo na 😭❤️";

        noButton.innerHTML = "NO 😭";

        noButton.classList.add("runaway");

        noButton.onclick = runAway;

        noButton.onmouseover = runAway;

        noButton.ontouchstart = runAway;

    }

});


/* =========================
   FINAL MESSAGE
========================= */

function showFinalMessage(text){

    message.innerHTML = text;

    buttons.innerHTML = "";

    createManyHearts(20);

}


/* =========================
   RUN AWAY BUTTON
========================= */

function runAway(){

    const button = document.getElementById("noButton");

    if(!button){
        return;
    }

    const maxX =
        window.innerWidth - button.offsetWidth - 20;

    const maxY =
        window.innerHeight - button.offsetHeight - 20;

    const x =
        Math.max(10, Math.random() * maxX);

    const y =
        Math.max(10, Math.random() * maxY);

    button.style.left = x + "px";

    button.style.top = y + "px";

}


/* =========================
   FLOATING HEART
========================= */

function createHeart(){

    const heart = document.createElement("div");

    heart.className = "heart";

    const heartList = [
        "❤️",
        "💖",
        "💕",
        "💗",
        "💓",
        "💘",
        "🥰"
    ];

    heart.innerHTML =
        heartList[
            Math.floor(Math.random() * heartList.length)
        ];

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.animationDuration =
        (5 + Math.random() * 5) + "s";

    document.body.appendChild(heart);

    setTimeout(function(){

        heart.remove();

    },10000);

}


/* =========================
   MANY HEARTS
========================= */

function createManyHearts(number){

    for(let i = 0; i < number; i++){

        setTimeout(function(){

            createHeart();

        }, i * 120);

    }

}


/* =========================
   FLOATING MUSIC NOTES
========================= */

function createNote(){

    const note = document.createElement("div");

    note.className = "note";

    const noteList = [
        "🎵",
        "🎶",
        "♪",
        "♫"
    ];

    note.innerHTML =
        noteList[
            Math.floor(Math.random() * noteList.length)
        ];

    note.style.left =
        Math.random() * 100 + "vw";

    note.style.animationDuration =
        (4 + Math.random() * 4) + "s";

    document.body.appendChild(note);

    setTimeout(function(){

        note.remove();

    },8000);

}


/* =========================
   ANIMATIONS
========================= */

setInterval(createHeart, 600);

setInterval(createNote, 1000);


/* =========================
   SONG ENDED
========================= */

music.addEventListener("ended", function(){

    musicButton.innerHTML = "▶️ Play Music";

});

</script>

</body>
</html>
